# Store URLs, API endpoints, and file names# config.yaml
project_name: "osteosarcoma_project"

# Directory Structure (Python will use this to ensure folders exist)
directories:
  raw_data: "data/raw"
  processed_data: "data/processed"


# Primary Data Sources
datasets:
# TARGET-OS dataset
  target_os:
    source_type: "UCSC_Xena"
    site_link: "https://xenabrowser.net/datapages/?dataset=TARGET-OS.survival.tsv&host=https%3A%2F%2Fgdc.xenahubs.net&removeHub=https%3A%2F%2Fxena.treehouse.gi.ucsc.edu%3A443"
    link: "https://gdc-hub.s3.us-east-1.amazonaws.com/download/TARGET-OS.survival.tsv.gz"
    phenotypes: "TARGET-OS.clinical.tsv.gz"
    counts: "TARGET-OS.clinical.tsv.gz"

# GSE33382 dataset
  gse33382:
    source_type: "GEO"
    accession_num: "GSE33382"
    link: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE33382"

# GSE87437 dataset
  gse87437:
    source_type: "GEO"
    accession_num: "GSE87437"
    link: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE87437"


# Osteosarcoma-specific gene panel (fixed, label-blind filter)
gene_panels:
  # Pharmacogenetics of Neoadjuvant MAP Chemotherapy in Localized Osteosarcoma: A Study Based on Data from the GEIS-33 Protocol
  pmc11677811:
    citation: "PMC11677811"
    genes: ["MTHFR", "SLC19A1", "ABCB1", "ABCC2", "ABCC3", "ERCC1", "ERCC2", "GSTP1"]

  # Pharmacogenetics of the Primary and Metastatic Osteosarcoma: Gene Expression Profile Associated with Outcome
  pmc10059037:
    citation: "PMC10059037"
    genes: ["TOP2A", "DHFR", "BCL2L1", "CASP3", "FASLG", "GSTM3", "SOD1", "ABCC1", "ABCC4", 
            "ABCC5", "ABCC6", "ABCC10", "ABCC11", "ABCG2", "RALBP1", "SLC22A1", "MSH2"]